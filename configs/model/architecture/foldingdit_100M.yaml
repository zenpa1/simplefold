_target_: model.torch.architecture.FoldingDiT

hidden_size: 768
num_heads: 12
atom_num_heads: 4
output_channels: 3
use_atom_mask: False
use_length_condition: True
use_energy_condition: True # NEW
# >>> MODIFICATION START: SparseUpcycling
energy_cond_dim: 768
gsa_block_size: 64
moe_num_experts: 4
moe_top_k: 2
# <<< MODIFICATION END: SparseUpcycling
esm_dropout_prob: 0.0
esm_model: esm2_3B

energy_embedder: # NEW
  _target_: model.torch.layers.EnergyEmbedder
  hidden_size: 768

time_embedder:
  _target_: model.torch.layers.TimestepEmbedder
  hidden_size: 768

aminoacid_pos_embedder:
  _target_: model.torch.pos_embed.AbsolutePositionEncoding
  in_dim: 1
  embed_dim: 768
  include_input: True

pos_embedder:
  _target_: model.torch.pos_embed.FourierPositionEncoding
  in_dim: 3
  include_input: True
  min_freq_log2: 0
  max_freq_log2: 12
  num_freqs: 128
  log_sampling: True

trunk:
  _target_: model.torch.blocks.HomogenTrunk
  depth: 8
  block:
    _target_: model.torch.blocks.DiTBlock
    _partial_: True # because in the for loop we create a new module
    hidden_size: 768
    mlp_ratio: 4.0
    use_swiglu: True # SwiGLU FFN
    # >>> MODIFICATION START: SparseUpcycling
    energy_cond_dim: ${energy_cond_dim}
    # <<< MODIFICATION END: SparseUpcycling
    feed_forward_layer: # NEW
      _target_: model.torch.layers.TopologyConditionedMoE
      _partial_: True
      dim: 768
      hidden_dim: 3072 # matches hidden_size * mlp_ratio (768*4)
      # >>> MODIFICATION START: SparseUpcycling
      num_experts: ${moe_num_experts}
      top_k: ${moe_top_k}
      topology_dim: ${hidden_size}
    # <<< MODIFICATION END: SparseUpcycling
    self_attention_layer: # NEW
      _target_: model.torch.layers.GatedSparseAttention
      _partial_: True
      hidden_size: 768
      num_heads: 12
      qk_norm: True
      # >>> MODIFICATION START: SparseUpcycling
      block_size: ${gsa_block_size}
      # <<< MODIFICATION END: SparseUpcycling
      sparsity_window: null # SUBJECT TO CHANGE
      pos_embedder:
        _target_: model.torch.pos_embed.AxialRotaryPositionEncoding
        in_dim: 4
        embed_dim: 768
        num_heads: 12
        base: 100.0

atom_hidden_size_enc: 256
atom_n_queries_enc: 32
atom_n_keys_enc: 128
atom_encoder_transformer:
  _target_: model.torch.blocks.HomogenTrunk
  depth: 1
  block:
    _target_: model.torch.blocks.DiTBlock
    _partial_: True # because in the for loop we create a new module
    hidden_size: 256
    mlp_ratio: 4.0
    use_swiglu: True # SwiGLU FFN
    self_attention_layer:
      _target_: model.torch.layers.EfficientSelfAttentionLayer
      _partial_: True
      hidden_size: 256
      num_heads: 4
      qk_norm: True
      pos_embedder:
        _target_: model.torch.pos_embed.AxialRotaryPositionEncoding
        in_dim: 4
        embed_dim: 256
        num_heads: 4
        base: 100.0

atom_hidden_size_dec: 256
atom_n_queries_dec: 32
atom_n_keys_dec: 128
atom_decoder_transformer:
  _target_: model.torch.blocks.HomogenTrunk
  depth: 1
  block:
    _target_: model.torch.blocks.DiTBlock
    _partial_: True # because in the for loop we create a new module
    hidden_size: 256
    mlp_ratio: 4.0
    use_swiglu: True # SwiGLU FFN
    self_attention_layer:
      _target_: model.torch.layers.EfficientSelfAttentionLayer
      _partial_: True
      hidden_size: 256
      num_heads: 4
      qk_norm: True
      pos_embedder:
        _target_: model.torch.pos_embed.AxialRotaryPositionEncoding
        in_dim: 4
        embed_dim: 256
        num_heads: 4
        base: 100.0
